name: Magentic-Marketplace Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install uv
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      with:
        version: "latest"

    - name: Sync dependencies
      run: uv sync

    - name: Run package-specific tests
      run: uv run pytest -m "not skip_ci and not rnr and not postgres" packages/magentic-marketplace/tests/

