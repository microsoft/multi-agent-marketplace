name: Magentic-Marketplace Tests

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "latest"

    - name: Sync dependencies
      run: uv sync

    - name: Run package-specific tests
      run: uv run pytest -m "not skip_ci and not rnr and not postgres" packages/magentic-marketplace/tests/

